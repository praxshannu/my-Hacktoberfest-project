<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>College Group Organizer</title><style>:root{--ink:#17212b;--muted:#687581;--line:#dfe6ea;--teal:#16777b}*{box-sizing:border-box}body{margin:0;background:#f7fafb;color:var(--ink);font:14px system-ui}.app{display:grid;grid-template-columns:220px 1fr 380px;min-height:100vh}.side,.right{background:#fff;padding:24px 16px}.side{border-right:1px solid var(--line)}.right{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:100vh}.main{padding:24px 28px}.brand{font-size:17px;font-weight:700;margin-bottom:25px}.search{width:100%;padding:13px;border:1px solid var(--line);border-radius:11px}.toolbar{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--line);padding:16px 0}.chip,button{border:0;border-radius:9px;padding:9px 11px;background:#edf3f4;color:#40545c;cursor:pointer;margin:3px}.chip.active{background:#d8edef;color:#145e63;font-weight:700}.meta{padding:14px 0;color:var(--muted)}.card,.tasks{background:white;border:1px solid var(--line);border-radius:13px;padding:16px;margin:0 0 12px}.tag{font-size:11px;font-weight:700;color:#687581}.card h2{font-size:17px}.body{white-space:pre-wrap;max-height:130px;overflow:hidden}.copy{background:#f1f5f6;border-radius:12px;padding:14px}.answer{max-height:55vh;overflow:auto}.status{color:var(--muted);font-size:12px;margin:8px 0}.model{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px}.chatlog{flex:1;min-height:100px;max-height:55vh;overflow:auto;padding:8px 0}.bubble{padding:10px 12px;border-radius:12px;margin:7px 0;max-width:92%}.bubble.user{margin-left:auto;background:#d8edef}.bubble.ai{background:#f1f5f6;border:1px solid var(--line)}.chatrow{display:flex;gap:5px;position:sticky;bottom:0;background:#fff;padding-top:8px}.chatrow input{min-width:0;flex:1;padding:10px;border:1px solid var(--line);border-radius:8px}.chatrow button{background:var(--teal);color:#fff}.error-banner{display:none;background:#ffe1e1;color:#8d2020;border:1px solid #d97878;border-radius:8px;padding:10px;margin:12px 28px 0;font-weight:600}.error-banner.show{display:block}.task{border-top:1px solid var(--line);padding:10px 0}.task summary{cursor:pointer;list-style:none}.badge{display:inline-block;border-radius:9px;padding:3px 7px;font-size:10px;font-weight:700;margin:0 7px}.overdue{background:#5e1c25;color:#fff}.today{background:#efc1c1;color:#8d2020}.tomorrow{background:#f7dfaa;color:#795515}.this_week{background:#edf3f4}.later,.no_date{background:#e9edef;color:#687581}.md h1,.md h2{margin:8px 0}.md ul,.md ol{padding-left:22px}.md p{margin:7px 0}@media(max-width:1000px){.app{grid-template-columns:190px 1fr}.right{display:flex;grid-column:1/-1;min-height:500px;border-left:0;border-top:1px solid var(--line)}}@media(max-width:650px){.app{display:block}.side{border:0}.main{padding:15px}}</style></head><body><div id="errorBanner" class="error-banner"></div><div class="app"><aside class="side"><div class="brand">▐ College Group<br>　Organizer</div><nav id="nav"></nav><h4>KEY GROUPS</h4><div id="groups"></div></aside><main class="main"><input class="search" id="search" placeholder="Search notices…"><h1>Inbox</h1><div id="subtitle">Loading notices…</div><div class="toolbar" id="toolbar"></div><div class="meta"><b id="count"></b> · <label><input type="checkbox" id="expired"> Show expired</label><button id="synthesize">Synthesize current view</button></div><section id="tasks" class="tasks"></section><section id="feed"></section></main><aside class="right"><h2>⚙ AI Synthesis <small id="badge">Local</small></h2><div class="copy answer md" id="synthesis">Select a notice or ask a question to get a local-model summary.</div><h3>▣ Message AI Chat</h3><div class="chatlog" id="log"></div><div class="chatrow"><input id="question" placeholder="Ask about the visible notices…"><button id="send">➤</button></div><select class="model" id="models"></select><button id="retry">Retry connection</but
