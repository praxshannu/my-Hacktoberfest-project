<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>College Group Organizer</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --ink:#e2e8f0; --dim:#94a3b8;
          --acc:#38bdf8; --pill:#334155; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         background:var(--bg); color:var(--ink); }
  header { padding:20px 16px 8px; max-width:960px; margin:0 auto; }
  header h1 { margin:0 0 4px; font-size:1.4rem; }
  header p { margin:0; color:var(--dim); font-size:.9rem; }
  #stats { display:flex; flex-wrap:wrap; gap:8px; padding:12px 16px 0;
           max-width:960px; margin:0 auto; }
  .chip { background:var(--pill); border-radius:999px; padding:4px 12px;
          font-size:.8rem; color:var(--ink); }
  .chip b { color:var(--acc); }
  #filters { position:sticky; top:0; z-index:5; background:#0f172af2;
             padding:10px 16px; border-bottom:1px solid #334155;
             max-width:960px; margin:8px auto 0; }
  #filters .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center;
                  max-width:960px; margin:0 auto; }
  #filters button { background:var(--pill); color:var(--ink); border:0;
                    border-radius:999px; padding:6px 14px; cursor:pointer;
                    font-size:.85rem; }
  #filters button.active { background:var(--acc); color:#0f172a; font-weight:600; }
  #search { flex:1; min-width:160px; padding:7px 12px; border-radius:999px;
            border:1px solid #475569; background:#0b1220; color:var(--ink); }
  #filters label { font-size:.8rem; color:var(--dim); display:flex; gap:6px;
                   align-items:center; }
  #groups { padding:7px 10px; border-radius:8px; background:#0b1220;
            color:var(--ink); border:1px solid #475569; }
  main { max-width:960px; margin:0 auto; padding:8px 16px 60px; }
  section h2 { font-size:1.05rem; margin:24px 0 10px; color:var(--acc); }
  section h2 span { color:var(--dim); font-weight:400; font-size:.8rem; }
  .card { background:var(--card); border-radius:12px; padding:12px 14px;
          margin:0 0 10px; }
  .card .meta { display:flex; flex-wrap:wrap; gap:6px; align-items:center;
                font-size:.75rem; color:var(--dim); margin-bottom:6px; }
  .tag { border-radius:6px; padding:2px 8px; font-weight:600; font-size:.72rem;
         text-transform:uppercase; letter-spacing:.03em; }
  .tag.Deadline { background:#7f1d1d; color:#fecaca; }
  .tag.Action { background:#78350f; color:#fde68a; }
  .tag.Schedule { background:#1e3a8a; color:#bfdbfe; }
  .tag.Opportunity { background:#14532d; color:#bbf7d0; }
  .tag.Resource { background:#4a044e; color:#f5d0fe; }
  .tag.Attendance { background:#3f3f46; color:#e4e4e7; }
  .tag.Noise { background:#27272a; color:#a1a1aa; }
  .seen { background:#0e7490; color:#cffafe; border-radius:999px;
          padding:2px 10px; font-size:.72rem; }
  .dl { background:#7f1d1d; color:#fecaca; border-radius:6px;
        padding:2px 8px; font-size:.72rem; }
  .text { white-space:pre-wrap; word-break:break-word; font-size:.92rem;
          line-height:1.45; }
  .text.clamp { display:-webkit-box; -webkit-line-clamp:6;
                -webkit-box-orient:vertical; overflow:hidden; }
  .more { background:none; border:0; color:var(--acc); cursor:pointer;
          padding:4px 0 0; font-size:.8rem; }
  .text a { color:var(--acc); }
  .attend-count { font-size:1.6rem; font-weight:700; color:var(--acc); }
  #empty { color:var(--dim); padding:30px 0; text-align:center; }
  footer { max-width:960px; margin:0 auto; padding:0 16px 30px;
           color:var(--dim); font-size:.78rem; }
</style>
</head>
<body>
<header>
  <h1>College Group Organizer</h1>
  <p id="subtitle">Loading…</p>
</header>
<div id="stats"></div>
<div id="filters">
  <div class="row" id="tagbar"></div>
  <div class="row" style="margin-top:8px">
    <input id="search" type="search" placeholder="Search notices, senders, groups…">
    <select id="groups"><option value="">All groups</option></select>
    <label><input type="checkbox" id="shownoise"> show Noise</label>
  </div>
</div>
<main id="main"></main>
<footer>Local-only MVP · senders masked · roll-number lists never shown, only counted.</footer>

<script>
"use strict";
const TAGS = ["Deadline","Action","Schedule","Opportunity","Resource","Attendance","Noise"];
const state = { tag:"Home", q:"", group:"", showNoise:false, data:[], summary:null };

async function loadJSON(paths) {
  for (const p of paths) {
    try { const r = await fetch(p); if (r.ok) return await r.json(); }
    catch (e) { /* try next path */ }
  }
  return null;
}

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function linkify(s) {
  return esc(s).replace(/(https?:\/\/[^\s<]+|www\.[^\s<]+)/g,
    '<a href="$1" target="_blank" rel="noopener">$1</a>');
}

function filtered() {
  const q = state.q.trim().toLowerCase();
  return state.data.filter(n => {
    if (!state.showNoise && n.tag === "Noise") return false;
    if (state.tag !== "Home" && state.tag !== "All" && n.tag !== state.tag) return false;
    if (state.group && !n.groups.includes(state.group)) return false;
    if (q && !(n.display_text.toLowerCase().includes(q) ||
               n.senders.join(" ").toLowerCase().includes(q) ||
               n.groups.join(" ").toLowerCase().includes(q) ||
               (n.preview||"").toLowerCase().includes(q))) return false;
    return true;
  });
}

function card(n) {
  const seen = n.seen_count > 1
    ? `<span class="seen">seen ${n.seen_count}×</span>` : "";
  const dl = n.deadline_iso
    ? `<span class="dl">⏰ ${esc(n.deadline_text || n.deadline_iso)} · ${esc(n.deadline_iso)}</span>` : "";
  const flags = [n.is_forwarded ? "↪ forwarded" : "",
                 n.is_media ? "📎 media" : ""].filter(Boolean)
    .map(esc).join(" · ");
  const when = n.timestamp ? esc(n.timestamp.slice(0,16).replace("T"," ")) : "?";
  const long = n.display_text.length > 500;
  let body;
  if (n.tag === "Attendance") {
    body = `<div class="attend-count">${n.roll_count} listed</div>
            <div class="text">${linkify(n.display_text.slice(0,240))}</div>`;
  } else {
    body = `<div class="text${long ? " clamp" : ""}">${linkify(n.display_text)}</div>` +
      (long ? `<button class="more">show more</button>` : "");
  }
  return `<article class="card" data-id="${esc(n.id)}">
    <div class="meta"><span class="tag ${esc(n.tag)}">${esc(n.tag)}</span>
      ${seen} ${dl}<span>${esc(n.sender_masked)} · ${esc(n.groups.join(", "))} · ${when}</span>
      ${flags ? `<span>${flags}</span>` : ""}</div>${body}</article>`;
}

function section(title, sub, items) {
  if (!items.length) return "";
  return `<section><h2>${esc(title)} <span>${esc(sub)}</span></h2>` +
    items.map(card).join("") + `</section>`;
}

function render() {
  const main = document.getElementById("main");
  const list = filtered();
  if (state.tag !== "Home") {
    main.innerHTML = list.length
      ? section(state.tag === "All" ? "All notices" : state.tag,
                `${list.length} shown`, list.slice(0, 200)) : `<div id="empty">Nothing here.</div>`;
    return;
  }
  const byTag = t => list.filter(n => n.tag === t);
  const deadlines = byTag("Deadline").slice()
    .sort((a,b) => (a.deadline_iso||"9").localeCompare(b.deadline_iso||"9"));
  const actions = byTag("Action").slice()
    .sort((a,b) => (b.timestamp||"").localeCompare(a.timestamp||""));
  const schedules = byTag("Schedule").slice()
    .sort((a,b) => (b.timestamp||"").localeCompare(a.timestamp||"")).slice(0, 10);
  const opps = byTag("Opportunity").slice()
    .sort((a,b) => (b.timestamp||"").localeCompare(a.timestamp||""));
  const res = byTag("Resource").slice()
    .sort((a,b) => (b.timestamp||"").localeCompare(a.timestamp||"")).slice(0, 12);
  const attend = byTag("Attendance").slice()
    .sort((a,b) => (b.timestamp||"").localeCompare(a.timestamp||""));
  main.innerHTML =
    section("⏰ Deadlines & action", "due dates first, then things to do",
            [...deadlines, ...actions].slice(0, 30)) +
    section("🗓 Schedule", "latest room allotments & timings", schedules) +
    section("🚀 Opportunities", "contests, internships, programs", opps.slice(0, 20)) +
    section("📚 Resources", "files, sheets & links with context", res) +
    section("🧾 Attendance", "counts only — lists never shown", attend);
  if (!list.length) main.innerHTML = `<div id="empty">Nothing here.</div>`;
}

function renderBar() {
  const bar = document.getElementById("tagbar");
  const counts = {};
  state.data.forEach(n => { counts[n.tag] = (counts[n.tag]||0)+1; });
  const opts = ["Home","All",...TAGS];
  bar.innerHTML = opts.map(t =>
    `<button data-t="${t}" class="${state.tag===t?"active":""}">${t}` +
    (counts[t] ? ` (${counts[t]})` : "") + `</button>`).join("");
  bar.querySelectorAll("button").forEach(b =>
    b.addEventListener("click", () => { state.tag = b.dataset.t; renderBar(); render(); }));
}

function renderStats() {
  const s = state.summary, el = document.getElementById("stats");
  const counts = s ? s.counts_per_tag : {};
  if (!s) {
    const c = {};
    state.data.forEach(n => { c[n.tag]=(c[n.tag]||0)+1; });
    el.innerHTML = TAGS.map(t=>`<span class="chip">${t} <b>${c[t]||0}</b></span>`).join("");
    return;
  }
  el.innerHTML = TAGS.map(t=>`<span class="chip">${t} <b>${counts[t]||0}</b></span>`).join("") +
    `<span class="chip">${s.unique_notices} notices · ${s.total_messages} messages · ` +
    `${(s.duplicate_groups||[]).length} repeated</span>`;
  document.getElementById("subtitle").textContent =
    `${s.total_messages} messages → ${s.unique_notices} unique notices` +
    (s.date_range[0] ? ` · ${s.date_range[0]} → ${s.date_range[1]}` : "");
}

document.getElementById("search").addEventListener("input", e => {
  state.q = e.target.value; render();
});
document.getElementById("shownoise").addEventListener("change", e => {
  state.showNoise = e.target.checked; render();
});
document.getElementById("groups").addEventListener("change", e => {
  state.group = e.target.value; render();
});
document.getElementById("main").addEventListener("click", e => {
  if (!e.target.classList.contains("more")) return;
  const txt = e.target.closest(".card").querySelector(".text");
  const open = txt.classList.toggle("clamp");
  e.target.textContent = open ? "show more" : "show less";
});

(async function init() {
  // Works when served from the repo root (python -m http.server) → /web/.
  const data = await loadJSON(["../output/messages.json", "output/messages.json",
                               "messages.json"]);
  state.summary = await loadJSON(["../output/summary.json", "output/summary.json",
                                  "summary.json"]);
  if (!data) {
    document.getElementById("subtitle").textContent =
      "Could not load output/messages.json — run python3 build.py, then serve the repo root.";
    return;
  }
  state.data = data;
  const groups = [...new Set(data.flatMap(n => n.groups))].sort();
  document.getElementById("groups").innerHTML =
    `<option value="">All groups</option>` +
    groups.map(g => `<option>${esc(g)}</option>`).join("");
  renderStats(); renderBar(); render();
})();
</script>
</body>
</html>
